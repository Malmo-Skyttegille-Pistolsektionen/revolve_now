site_name: Revolve Now
site_description: Documentation for Revolve Now, the shooting-range target system
repo_url: https://github.com/Malmo-Skyttegille-Pistolsektionen/revolve_now
repo_name: revolve_now
docs_dir: docs/site

theme:
  name: material
  logo: img/revolve-now-header.svg
  favicon: img/revolve-now.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

nav:
  - Home: index.md
  - Hardware and wiring: hardware.md
  - Connecting: connecting.md
  - Running a program: running-a-program.md
  - Programs and audio: programs-and-audio.md
  - Writing your own program: writing-a-program.md
  - Settings: settings.md
  - Expert mode: expert-mode.md
  - Status LED: status-led.md
  - Troubleshooting: troubleshooting.md
  - Figures and tables: lists.md

# Fills lists.md from the other pages at build time.
hooks:
  - docs/hooks/lists.py

markdown_extensions:
  - tables
  - admonition
  # The editor link on the front page is rendered as a button.
  - attr_list
  # Lets writing-a-program.md embed the example program from the same file
  # the page links for download, so the two cannot drift apart.
  - pymdownx.snippets:
      base_path: [docs/site]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
