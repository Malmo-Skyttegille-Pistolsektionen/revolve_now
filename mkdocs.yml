site_name: Revolve Now
site_description: Documentation for Revolve Now, the shooting-range target system
repo_url: https://github.com/Malmo-Skyttegille-Pistolsektionen/revolve_now
repo_name: revolve_now
docs_dir: docs/site

theme:
  name: material
  logo: img/revolve-now-header.svg
  favicon: img/revolve-now.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # Not navigation.instant: the i18n plugin's language switcher, which keeps
    # you on the same page in the other language, does not work with it.
    - navigation.tracking
    - content.code.copy
    - navigation.footer

nav:
  - Home: index.md
  - Hardware and wiring: hardware.md
  - Connecting: connecting.md
  - Running a program: running-a-program.md
  - Programs and audio: programs-and-audio.md
  - Writing your own program: writing-a-program.md
  - Settings: settings.md
  - Expert mode: expert-mode.md
  - Status LED: status-led.md
  - Troubleshooting: troubleshooting.md
  - Figures and tables: lists.md

# Fills lists.md, and its translations, from the other pages at build time.
hooks:
  - docs/hooks/lists.py

# Swedish beside English (#443). A page's translation sits next to it as
# `<page>.sv.md`; one that has no translation yet is served in English under
# the Swedish site, so a half-translated site still has every page. The
# language switcher in the header is Material's, wired up by the plugin.
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: sv
          name: Svenska
          build: true
          site_description: Dokumentation för Revolve Now, tavelanläggningen för skjutbanan
          nav_translations:
            Home: Hem
            Hardware and wiring: Hårdvara och inkoppling
            Connecting: Ansluta
            Running a program: Köra ett program
            Programs and audio: Program och ljud
            Writing your own program: Skriva ett eget program
            Settings: Inställningar
            Expert mode: Expertläge
            Status LED: Statuslampan
            Troubleshooting: Felsökning
            Figures and tables: Figurer och tabeller

markdown_extensions:
  - tables
  - admonition
  # The editor link on the front page is rendered as a button.
  - attr_list
  # Lets writing-a-program.md embed the example program from the same file
  # the page links for download, so the two cannot drift apart.
  - pymdownx.snippets:
      base_path: [docs/site]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
