---
name: renovate-derived-files

# Renovate (the hosted app) bumps a version but cannot regenerate the files
# derived from it; `postUpgradeTasks` would, but runs only self-hosted. This
# does that work on Renovate's own branches and pushes the result (#417).
#
# A `paths:` filter is safe here, unlike in the other workflows: nothing in it
# is a required check, so a run that never happens blocks nothing.
on:
  pull_request:
    paths:
      - firmware/main/idf_component.yml
      - .github/actions/setup-git-cliff/action.yml

permissions:
  contents: read

concurrency:
  group: renovate-derived-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Runs the PR's code (CMake, the component manager) and so holds no secret.
  # The push token exists only in the job below, which runs nothing from the
  # PR but `git apply`.
  derive:
    name: renovate derived files
    if: startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: false
          # The branch itself, not the merge commit `pull_request` checks out:
          # the patch is applied to the branch.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/trust-workspace

      # Build directory and SDKCONFIG outside the tree, so the lock is the only
      # file this can change.
      - name: Regenerate firmware/dependencies.lock
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B "$RUNNER_TEMP/build" -D SDKCONFIG="$RUNNER_TEMP/sdkconfig" -D RT_ALLOW_STALE_WEBAPP=ON reconfigure

      - name: Pin the git-cliff digest
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --depth 1 origin "$BASE_SHA"
          git show "$BASE_SHA:.github/actions/setup-git-cliff/action.yml" > "$RUNNER_TEMP/base-action.yml"
          python3 .github/scripts/pin_git_cliff_digest.py \
            .github/actions/setup-git-cliff/action.yml "$RUNNER_TEMP/base-action.yml"

      - name: Collect the derived files
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary -- firmware/dependencies.lock .github/actions/setup-git-cliff/action.yml > derived.patch
          if [ -s derived.patch ]; then
            cat derived.patch
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to regenerate."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7.0.1
        if: steps.diff.outputs.changed == 'true'
        with:
          name: derived-patch
          path: derived.patch
          if-no-files-found: error

  commit:
    name: renovate derived files (commit)
    needs: derive
    if: needs.derive.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check the App is configured
        env:
          APP_ID: ${{ secrets.RENOVATE_DERIVED_FILES_APP_ID }}
          PRIVATE_KEY: ${{ secrets.RENOVATE_DERIVED_FILES_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::RENOVATE_DERIVED_FILES_APP_ID and RENOVATE_DERIVED_FILES_PRIVATE_KEY must be set (#417)."
            exit 1
          fi

      # An App token, not GITHUB_TOKEN: a push made with GITHUB_TOKEN starts no
      # workflows, so the required checks would never run on the new head.
      - uses: actions/create-github-app-token@v3.2.0
        id: app
        with:
          app-id: ${{ secrets.RENOVATE_DERIVED_FILES_APP_ID }}
          private-key: ${{ secrets.RENOVATE_DERIVED_FILES_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app.outputs.token }}
          submodules: false

      - uses: actions/download-artifact@v8.0.1
        with:
          name: derived-patch
          path: ${{ runner.temp }}/derived

      - name: Commit and push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          BRANCH: ${{ github.head_ref }}
          DERIVED_FROM: ${{ github.event.pull_request.head.sha }}
          PATCH: ${{ runner.temp }}/derived/derived.patch
        run: |
          set -euo pipefail
          # A newer push to the branch gets a run of its own; this patch was
          # computed against a head that is no longer there.
          if [ "$(git rev-parse HEAD)" != "$DERIVED_FROM" ]; then
            echo "::notice::$BRANCH moved past $DERIVED_FROM; leaving it to that push's run."
            exit 0
          fi

          ALLOWED=$'.github/actions/setup-git-cliff/action.yml\nfirmware/dependencies.lock'
          UNEXPECTED="$(git apply --numstat "$PATCH" | cut -f3 | grep -vxF "$ALLOWED" || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::The patch touches files it has no business with: $UNEXPECTED"
            exit 1
          fi
          git apply "$PATCH"

          BOT="${APP_SLUG}[bot]"
          BOT_ID="$(gh api "/users/${BOT}" --jq .id)"
          git config user.name "$BOT"
          git config user.email "${BOT_ID}+${BOT}@users.noreply.github.com"
          git add -- firmware/dependencies.lock .github/actions/setup-git-cliff/action.yml
          git commit -s -m "chore: regenerate files derived from the bump" \
            -m "Written by .github/workflows/renovate-derived-files.yml."
          git push origin "HEAD:${BRANCH}"
