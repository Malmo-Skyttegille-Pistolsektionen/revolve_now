---
name: webapp-e2e

# The webapp driven by a browser against the real firmware, booted in QEMU out
# of the same image the board is flashed with. Nothing here is mocked: the
# bundle under test is the one `RT_WEBAPP_DIR` bakes into the application image
# (#227), and the API and SSE stream come from the firmware binary itself. That
# is the point - it is what makes webapp/mock drift impossible to ship.
#
# A workflow of its own rather than a job in webapp-build.yml or
# firmware-build.yml: it is the only thing here that needs both toolchains, its
# paths filter is the union of both (a firmware change can break it just as
# easily as a webapp change), and it is allowed to take ~10 minutes where those
# two are kept fast. Failing it should not hold up the signal from either.

on:
  # No `paths:` filter, deliberately. These checks are required by the
  # `protect-main` ruleset, and a required check that never runs blocks the pull
  # request forever - so every workflow has to report on every PR. A change
  # these checks cannot see is skipped inside the jobs instead: see `changes`.
  push:
    branches: [main]
  pull_request:

  # Called by release.yml so the release is gated on the same checks that guard
  # main, run at the exact commit that gets tagged.
  workflow_call:

permissions:
  contents: read

# A superseded run should not keep this going. The group carries a literal
# prefix as well as `github.workflow`, because `github.workflow` is the *caller*
# name when release.yml calls this workflow - without the prefix, two workflows
# called from the same release run would land in one group and cancel each
# other.
concurrency:
  group: webapp-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which areas this pull request touches; firmware-build.yml says how the
  # jobs below use the answer.
  changes:
    name: changed areas
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.areas.outputs.firmware }}
      webapp: ${{ steps.areas.outputs.webapp }}
      contracts: ${{ steps.areas.outputs.contracts }}
      e2e: ${{ steps.areas.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
          persist-credentials: false
          # The merge commit and its first parent: the base it would merge into.
          fetch-depth: 2

      - id: areas
        run: python3 .github/scripts/changed_areas.py >> "$GITHUB_OUTPUT"

  e2e:
    name: webapp end-to-end
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # One job, in the IDF container, rather than a firmware job that hands a
    # flash image to a browser job: the emulator is Espressif's qemu-xtensa
    # fork, which ships inside this image and nowhere a plain runner can
    # `apt install` it from. Passing the image between jobs would mean
    # installing that fork on the runner anyway, so the container is the
    # cheaper half to add a browser to - the espressif/idf image is Ubuntu 24.04,
    # which Playwright supports and installs its own deps for.
    container:
      image: >-
        ${{ needs.changes.outputs.e2e != 'false'
        && 'espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c' || '' }}
    timeout-minutes: 30
    # The QEMU profile's compiler cache, which firmware-build.yml saves from
    # main; read-only here.
    env:
      CCACHE_DIR: /github/home/.ccache
      # IDF writes picolibc.specs into the build directory, and the default
      # check hashes its mtime: every fresh build would miss.
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.e2e != 'false'
        with:
          submodules: false

      - uses: ./.github/actions/trust-workspace
        if: needs.changes.outputs.e2e != 'false'

      - uses: actions/setup-node@v7.0.0
        if: needs.changes.outputs.e2e != 'false'
        with:
          node-version-file: webapp/package.json
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp dependencies
        if: needs.changes.outputs.e2e != 'false'
        working-directory: webapp
        run: npm ci

      - name: Resolve the Playwright version
        if: needs.changes.outputs.e2e != 'false'
        id: pw
        working-directory: webapp
        # The browser build is pinned to the Playwright release, so that is the
        # only sane cache key.
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        if: needs.changes.outputs.e2e != 'false'
        uses: actions/cache@v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: needs.changes.outputs.e2e != 'false'
        working-directory: webapp
        # `.npmrc` sets ignore-scripts, so npm ci never downloads a browser -
        # this step is not optional. The apt half of `--with-deps` is not
        # cacheable and runs either way; only the browser download is skipped
        # on a cache hit.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Build the webapp
        if: needs.changes.outputs.e2e != 'false'
        working-directory: webapp
        run: npm run build

      - name: Restore the compiler cache
        if: needs.changes.outputs.e2e != 'false'
        uses: actions/cache/restore@v6.1.0
        with:
          path: /github/home/.ccache
          key: ccache-qemu-${{ hashFiles('firmware/**', '.github/workflows/firmware-build.yml') }}
          restore-keys: ccache-qemu-

      - name: Build the QEMU firmware profile with that bundle baked in
        if: needs.changes.outputs.e2e != 'false'
        working-directory: firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          ccache --zero-stats
          # RT_WEBAPP_DIR defaults to ../webapp/dist, so the build above is
          # what lands in the application image (#227 - the bundle is embedded
          # in the app, not staged into the LittleFS partition).
          scripts/run-qemu.sh --build-only
          ccache --show-stats
          # The generated index is the packer's own record of what it embedded,
          # so this asserts the bundle is really in the binary rather than that
          # a staging directory happens to exist.
          grep -q '"/webapp/index.html' build-qemu/generated/embedded_index.generated.h || {
            echo "::error::the app image carries no webapp - check RT_WEBAPP_DIR"
            exit 1
          }

      - name: Boot QEMU
        if: needs.changes.outputs.e2e != 'false'
        id: boot
        working-directory: firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          # --no-build: the step above already built the tree, and the runner
          # execs qemu, so this PID is the emulator's.
          scripts/run-qemu.sh --no-build --headless > qemu-serial.log 2>&1 &
          echo "$!" > qemu.pid
          for _ in $(seq 1 180); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/api/v2/version; then
              echo "Serving after ${SECONDS}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::QEMU did not serve /api/v2/version within 180s"
          tail -40 qemu-serial.log
          exit 1

      - name: Run the E2E suite
        if: needs.changes.outputs.e2e != 'false'
        working-directory: webapp
        run: npx playwright test

      # The mock server's clock-free cases, against the same emulator: one set
      # of assertions holding the mock and the firmware to the same contract
      # (#452). Runs even when Playwright failed - it is a separate signal.
      - name: Run the mock-server contract suite against the firmware
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        working-directory: webapp
        env:
          CONTRACT_BASE_URL: http://127.0.0.1:8080
        run: npm run test:contract

      - name: Stop QEMU
        if: always() && needs.changes.outputs.e2e != 'false'
        working-directory: firmware
        shell: bash
        run: |
          [ -f qemu.pid ] || exit 0
          kill "$(cat qemu.pid)" 2>/dev/null || true

      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: e2e-failure
          path: |
            webapp/playwright-report/
            webapp/test-results/
            firmware/qemu-serial.log
          if-no-files-found: warn
          retention-days: 7
