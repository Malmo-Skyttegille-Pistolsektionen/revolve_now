---
name: check-semantic-pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

# A newer push or title edit supersedes the run.
concurrency:
  group: check-semantic-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: conventional commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The title job above checks the subject only, but squash-merging also keeps
  # every branch commit's body (`COMMIT_MESSAGES`), and a `BREAKING CHANGE:`
  # footer there marks the release breaking whatever the title says (#282,
  # AGENTS.md). This fails a footer the title does not declare with `!`.
  bump:
    name: release bump matches title
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Compare the title against the branch commit bodies
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          git log --format=%B "$BASE_SHA..$HEAD_SHA" | .github/scripts/check_breaking_marker.sh consistent
