---
name: webapp-build

on:
  # No `paths:` filter, deliberately. These checks are required by the
  # `protect-main` ruleset, and a required check that never runs blocks the pull
  # request forever - so every workflow has to report on every PR. A change
  # these checks cannot see is skipped inside the jobs instead: see `changes`.
  push:
    branches: [main]
  pull_request:

  # Called by release.yml so the release is gated on the same checks that guard
  # main, run at the exact commit that gets tagged.
  workflow_call:

permissions:
  contents: read

# A superseded run should not keep this going. The group carries a literal
# prefix as well as `github.workflow`, because `github.workflow` is the *caller*
# name when release.yml calls this workflow - without the prefix, two workflows
# called from the same release run would land in one group and cancel each
# other.
concurrency:
  group: webapp-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which areas this pull request touches; firmware-build.yml says how the
  # jobs below use the answer.
  changes:
    name: changed areas
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.areas.outputs.firmware }}
      webapp: ${{ steps.areas.outputs.webapp }}
      contracts: ${{ steps.areas.outputs.contracts }}
      e2e: ${{ steps.areas.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
          persist-credentials: false
          # The merge commit and its first parent: the base it would merge into.
          fetch-depth: 2

      - id: areas
        run: python3 .github/scripts/changed_areas.py >> "$GITHUB_OUTPUT"

  webapp:
    name: typecheck, lint, test, build
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.webapp != 'false'
        with:
          submodules: false

      - uses: actions/setup-node@v7.0.0
        if: needs.changes.outputs.webapp != 'false'
        with:
          node-version-file: webapp/package.json
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install
        if: needs.changes.outputs.webapp != 'false'
        run: npm ci

      - name: Check generated API types are up to date
        if: needs.changes.outputs.webapp != 'false'
        run: |
          npm run generate:api
          if ! git diff --exit-code src/api/generated.d.ts; then
            echo "::error::src/api/generated.d.ts is stale — run 'npm run generate:api' and commit it"
            exit 1
          fi

      - name: Typecheck
        if: needs.changes.outputs.webapp != 'false'
        run: npm run typecheck

      - name: Lint
        if: needs.changes.outputs.webapp != 'false'
        run: npm run lint

      - name: Test
        if: needs.changes.outputs.webapp != 'false'
        run: npm run test

      - name: Build
        if: needs.changes.outputs.webapp != 'false'
        run: npm run build

      - name: Check generated route tree is up to date
        if: needs.changes.outputs.webapp != 'false'
        run: |
          if ! git diff --exit-code src/routeTree.gen.ts; then
            echo "::error::src/routeTree.gen.ts is stale — run 'npm run build' and commit it"
            exit 1
          fi

      - name: Check gzip size budget
        if: needs.changes.outputs.webapp != 'false'
        run: |
          budget=$(cat size-budget)
          total=0
          count=0
          while IFS= read -r -d '' f; do
            size=$(gzip -nc "$f" | wc -c)
            total=$((total + size))
            count=$((count + 1))
          done < <(find dist -type f \( -name '*.js' -o -name '*.css' \) -print0)
          if [ "$count" -eq 0 ]; then
            echo "::error::no dist/**/*.{js,css} files found — build produced nothing to measure"
            exit 1
          fi
          echo "Total gzipped dist/**/*.{js,css}: ${total} bytes across ${count} files (budget: ${budget} bytes)"
          if [ "$total" -gt "$budget" ]; then
            echo "::error::gzip size budget exceeded: ${total} > ${budget} bytes (see webapp/size-budget)"
            exit 1
          fi
